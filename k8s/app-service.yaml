# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Bazaar Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  labels:
    app: profile-service
spec:
  type: ClusterIP
  selector:
    app: profile-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
