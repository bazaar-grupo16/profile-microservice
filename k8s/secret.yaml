# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Bazaar PostgreSQL Database
# ──────────────────────────────────────────────────────────────
# Complete secrets in GitHub repository secrets
apiVersion: v1
kind: Secret
metadata:
  name: profile-db-credentials
type: Opaque
stringData:
  DB_HOST: profile-db
  DB_PORT: "5432"
  DB_USER: $DB_USER
  DB_PASSWORD: $DB_PASSWORD
  DB_NAME: $DB_NAME
  # ── DigitalOcean Spaces ──────────────────────────
  SPACES_KEY: $SPACES_KEY
  SPACES_SECRET: $SPACES_SECRET
  SPACES_BUCKET: $SPACES_BUCKET
  SPACES_REGION: $SPACES_REGION
  SPACES_ENDPOINT: $SPACES_ENDPOINT
  SPACES_CDN_ENDPOINT: $SPACES_CDN_ENDPOINT
