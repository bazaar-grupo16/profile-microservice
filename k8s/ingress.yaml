apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: profile-ingress-api
  namespace: bazaar-dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1

    # ── CORS Configuration ───────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization"
    nginx.ingress.kubernetes.io/cors-max-age: "1728000"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
    nginx.ingress.kubernetes.io/auth-url: "http://auth-service.bazaar-dev.svc.cluster.local/validate"
    nginx.ingress.kubernetes.io/auth-method: "GET"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-ID"
    # ─────────────────────────────────────────────────────────────────────────

spec:
  rules:
    - http:
        paths:
          - path: /(profile/(me|upload-avatar))
            pathType: ImplementationSpecific
            backend:
              service:
                name: profile-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: profile-ingress-health
  namespace: bazaar-dev
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # ── CORS Configuration ───────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization"
    nginx.ingress.kubernetes.io/cors-max-age: "1728000"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
spec:
  rules:
    - http:
        paths:
          - path: /profile/(livez|readyz)
            pathType: ImplementationSpecific
            backend:
              service:
                name: profile-service
                port:
                  number: 80
          - path: /(profile/[0-9a-fA-F-]+)
            pathType: ImplementationSpecific
            backend:
              service:
                name: profile-service
                port:
                  number: 80